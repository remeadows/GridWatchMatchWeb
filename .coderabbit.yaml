# .coderabbit.yaml — GridWatchMatchWeb
# Stack:  Vite 8 + React 19 + Phaser 4 + TypeScript 6 (strict)
# Target: browser port of GridWatchMatch (iOS Swift). Animation parity is a
#         shipping requirement, not a nicety.
# Posture: hardened. Hosted CodeRabbit, defense-in-depth config.
# Owner:  Russ Meadows / WarSignalLabs
# Schema: https://docs.coderabbit.ai/reference/configuration

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
language: en-US
early_access: false
enable_free_tier: false

tone_instructions: >
  Direct, principal-engineer tone for a funded studio. No filler.
  This is a browser game with iOS parity as a release requirement.
  Surface: animation regressions vs the iOS source of truth, Phaser
  frame-budget violations, React 19 concurrent-rendering hazards,
  engine-purity breaches (DOM/React/Phaser in src/engine), save-data
  corruption risks, determinism breaks in the cascade engine.

# ---------------------------------------------------------------------------
# Reviews
# ---------------------------------------------------------------------------
reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  changed_files_summary: true
  collapse_walkthrough: false
  commit_status: true
  fail_commit_status: true
  poem: false
  in_progress_fortune: false
  enable_prompt_for_ai_agents: true

  slop_detection:
    enabled: true
    label: slop

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
    ignore_title_keywords:
      - WIP
      - "[skip-review]"
      - "art-only"
      - "asset-bump"
    ignore_usernames:
      - dependabot
      - renovate
      - coderabbitai
    base_branches:
      - main
      - release/.*

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
    simplify:
      enabled: false

  suggested_reviewers: true
  auto_assign_reviewers: false
  suggested_reviewers_instructions:
    - reviewers:
        - handle: remeadows
          type: user
      instructions: >
        Assign on changes to src/game/, src/engine/, src/state/, scripts/sync-ios-assets.mjs,
        or anything touching animation parity with iOS.

  suggested_labels: true
  auto_apply_labels: true
  labeling_instructions:
    - label: motion-parity
      instructions: Apply when PR touches src/game/motion.ts, BoardScene tweens, or anything referencing iOS BoardNode/GameScene animation.
    - label: phaser
      instructions: Apply when PR touches Phaser scenes, tweens, particles, or input handling.
    - label: react-ui
      instructions: Apply when PR touches React components outside src/game/ (HUD, modals, meta screens).
    - label: engine
      instructions: Apply when PR touches src/engine/ (cascade, match detection, gravity, RNG, power-ups).
    - label: save-data
      instructions: Apply when PR touches src/state/save.ts or progress persistence.
    - label: ios-asset-sync
      instructions: Apply when PR touches scripts/sync-ios-assets.mjs or src/data/assetManifest.generated.ts.
    - label: perf
      instructions: Apply when PR touches the render path, asset loading, or animation timing.
    - label: tests
      instructions: Apply when PR touches src/tests/ or tests/ or playwright.config.ts.
    - label: agent-generated
      instructions: Apply when PR description mentions Claude Code, Codex, or contains "generated by".

  # -------------------------------------------------------------------------
  # Path filters
  # -------------------------------------------------------------------------
  path_filters:
    - "!node_modules/**"
    - "!dist/**"
    - "!.vite/**"
    - "!coverage/**"
    - "!playwright-report/**"
    - "!test-results/**"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!package-lock.json"
    - "!yarn.lock"
    - "!pnpm-lock.yaml"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.webp"
    - "!**/*.gif"
    - "!**/*.wav"
    - "!**/*.mp3"
    - "!**/*.ogg"
    - "!**/*.m4a"
    - "!**/*.ttf"
    - "!**/*.otf"
    - "!**/*.woff*"
    # Generated files — keep authoring, skip review
    - "!src/data/assetManifest.generated.ts"

  # -------------------------------------------------------------------------
  # Path-scoped review instructions
  # iOS Source of Truth: ../GridWatchMatch/GridWatchMatch/GridWatchMatch/View/Game/
  #   BoardNode.swift, GameScene.swift, TileNode.swift, BoosterTrayView.swift,
  #   BoosterShaderOverlayView.swift, VFXOverlayView.swift, ShaderOverlayView.swift
  # -------------------------------------------------------------------------
  path_instructions:
    # ---- TypeScript baseline
    - path: "**/*.{ts,tsx}"
      instructions: >
        TypeScript 6 strict baseline. Flag: any `any` without `// @ts-expect-error`
        rationale; non-null assertions (`!`) in non-test paths; `as` casts that
        bypass type safety (prefer type guards); `// @ts-ignore` (use
        @ts-expect-error which fails compile when no longer needed); console.log
        in production paths (services/analytics or services/audio loggers only);
        empty catch blocks; missing await on Promise-returning calls; floating
        promises in event handlers; magic numbers in gameplay timing (extract
        to src/data/rules.ts or a typed constant module).

    # ---- React app shell (NOT game canvas — that's Phaser)
    - path: "src/{App,main}.tsx"
      instructions: >
        App entry. Wire providers/routing. No game logic here. Use
        React 19 concurrent-rendering primitives where appropriate
        (useTransition for non-urgent updates). Strict Mode safe
        (effects must tolerate double-invocation in dev).

    # ---- React UI (HUD, modals, meta — anything NOT the board canvas)
    - path: "src/**/*.tsx"
      instructions: >
        React 19 components. Require: explicit return types on exported
        components; `key` props on all list items (no array index keys for
        reorderable lists); `useCallback`/`useMemo` only when measurably
        justified (don't cargo-cult); explicit dependency arrays on
        useEffect/useMemo/useCallback (no missing deps); abort/cleanup in
        every useEffect that subscribes, schedules timers, or starts async
        work; accessibility — every interactive element has accessible name,
        keyboard handler, and focus-visible state; respect
        `prefers-reduced-motion` for any UI animation; no inline styles for
        anything theme-related (use CSS variables / theme tokens per
        AGENTS.md).

    # ---- Phaser/React BRIDGE — this is the highest-risk surface
    - path: "src/game/GameCanvas.tsx"
      instructions: >
        React → Phaser bridge. Phaser.Game lifecycle must be deterministic.
        Require: Phaser.Game created once per mount; explicit destroy(true)
        on cleanup; refs (not state) for the Phaser.Game instance to avoid
        re-render churn; props synced to scene via a stable sync(...) method,
        not by recreating the game; resize handling via Phaser.Scale.RESIZE
        with explicit min/max bounds; `reducedMotion` prop respected and
        propagated to scene; no Phaser.GameObjects references leaked into
        React state (per AGENTS.md "Persist serializable app state only,
        not Phaser objects"). StrictMode double-mount safe (must clean up
        and re-init cleanly).

    # ---- Phaser scene — frame budget and tween discipline
    - path: "src/game/BoardScene.ts"
      instructions: >
        Phaser scene, 60fps target. Frame budget 16.6ms (8.3ms for 120Hz).
        Required:
          * No per-frame allocations in update(): no `new`, no array literals,
            no object literals, no template strings inside the hot loop.
          * Tweens reused via Phaser.Tweens.TweenManager.add and
            removed/recycled, not created per cascade.
          * Texture atlases via Phaser.Loader.atlas, not individual loadImage.
          * Use scene.physics or arcade only if needed; avoid Matter for
            tile mechanics (overkill, expensive).
          * Pointer handling: use Phaser input + scene.input.activePointers=2
            and ensure DOM passive listeners on touchmove to avoid scroll jank.
          * Drag system: dragged container is the REAL occupant, not a ghost
            (per AGENTS.md Gameplay Feel Rules). Neighbor tile mirrors drag
            offset visibly while crossing into adjacent cell.
          * Invalid swap: both real sprites snap back; never a fade-out.
          * Valid swap: sprites settle into post-swap grid BEFORE match
            resolution starts. No back-slide-then-pop.

        iOS PARITY — cite source when changing timing constants:
          * Animation durations and easing must match
            ../GridWatchMatch/GridWatchMatch/GridWatchMatch/View/Game/BoardNode.swift
            and GameScene.swift. SKAction.timingMode mapped to Phaser easing:
              - .easeIn   → Phaser.Math.Easing.Quadratic.In
              - .easeOut  → Phaser.Math.Easing.Quadratic.Out
              - .easeInOut → Phaser.Math.Easing.Quadratic.InOut
            (or Cubic if iOS uses .easeInEaseOut with a custom CAMediaTimingFunction).
          * Cascade fall acceleration, settle bounce coefficient, pop scale
            range, centroid stagger per-unit delay — all sourced from the
            Swift implementation. Document the mapping in a comment near
            any timing constant.
          * If reducedMotion is true: instant transitions where possible;
            otherwise reduce durations by ≥50% AND remove jitter (no shake,
            no rotation jitter, no particle wobble).

    # ---- Motion primitives — direct iOS parity expected
    - path: "src/game/motion.ts"
      instructions: >
        Pure motion math derived from iOS. Each function comment MUST cite
        the iOS source location (file + function name). Determinism is
        non-negotiable: any randomness must be seeded so Playwright snapshots
        are stable. Flag Math.random() usage — use seededAngleJitter or
        engine RNG instead. When adding a new motion primitive:
          1. Identify the iOS counterpart (BoardNode.swift, GameScene.swift,
             TileNode.swift, VFXOverlayView.swift, ShaderOverlayView.swift).
          2. Document the function name and behavior delta.
          3. Add a deterministic test in src/tests/motion.test.ts.

    # ---- Pure engine — NO DOM, React, Phaser, storage, audio, analytics
    - path: "src/engine/**"
      instructions: >
        Pure TypeScript state machine. CRITICAL: this module must NOT import
        from any of:
          * react, react-dom
          * phaser
          * any DOM API (window, document, localStorage, sessionStorage)
          * src/services/*
          * src/game/* (engine is below game)
        Hard-flag any such import. The engine must run identically in Node
        for tests. Determinism: all randomness via src/engine/rng.ts seeded
        explicitly from level data. (level, seed, actions[]) → snapshot+delta
        must be replayable byte-for-byte.

    - path: "src/engine/rng.ts"
      instructions: >
        Seeded PRNG only. Flag any use of Math.random, Date.now-as-seed, or
        crypto.getRandomValues for game logic. The PRNG algorithm must match
        the iOS implementation (likely GKMersenneTwisterRandomSource) so
        replays from the same (level, seed, actions) produce the same board
        state on web and iOS.

    - path: "src/engine/boardEngine.ts"
      instructions: >
        Cascade engine authority. Action queue max depth 3 (per AGENTS.md).
        Each (action, snapshot) must produce a deterministic (snapshot,
        delta) pair. Edge cases required to be covered by unit tests:
        full board, empty board, all-locked, single-color, no-moves-
        available reshuffle, booster combos (rocket+TNT, lightball+X,
        propeller+X), encrypted/threat interactions.

    # ---- State / save data
    - path: "src/state/save.ts"
      instructions: >
        Save data integrity. Required:
          * Codable-equivalent: explicit shape, no `any`.
          * schemaVersion: number field on the persisted root.
          * Forward-only migration path for every schema bump.
          * Atomic writes via single localStorage/IndexedDB key; never
            partial writes.
          * Corrupted save → backup + recover with logged event;
            never silent reset.
          * No PII persisted unencrypted (web crypto for any token/secret).
          * Only serializable types persisted — flag any attempt to persist
            Phaser objects, DOM refs, or class instances (per AGENTS.md).

    - path: "src/state/progress.ts"
      instructions: >
        Player progression. Defensive coding: any external/imported level
        data must be schema-validated on load (use a type-narrowing guard
        function); failure to validate → log + refuse, not silent default.

    # ---- Data layer
    - path: "src/data/levels.ts"
      instructions: >
        Hand-authored levels copied from iOS. No procedural generation
        (per AGENTS.md). When a level format changes, update validate-levels
        and add a migration. Levels must remain reachable on the configured
        viewport (7 rows visible on desktop and mobile).

    - path: "src/data/rules.ts"
      instructions: >
        Player-facing rules text. Must match the in-game iOS tutorial copy.
        Power-up descriptions must reflect actual engine behavior
        (rocket = row/column clear, TNT = blast, propeller = 2x2 origin,
        lightball = all-of-color, locked block / zero-day = sealed obstacle).

    - path: "scripts/sync-ios-assets.mjs"
      instructions: >
        iOS asset sync script. Must be idempotent. Failure modes:
        missing source path → fail loudly with the expected sibling repo
        location; manifest mismatch → fail; checksum drift → log.
        Never silently overwrite user-edited assets. Output a diff summary.

    # ---- Services
    - path: "src/services/audio.ts"
      instructions: >
        Web Audio. Initialize lazily on first user gesture (iOS Safari
        autoplay policy). Unlock AudioContext on the first tap. Resume on
        visibilitychange. Pool audio nodes; never `new Audio` per play.
        Respect a global mute flag.

    - path: "src/services/analytics.ts"
      instructions: >
        Telemetry. Disabled by default per AGENTS.md. No PII. Batched +
        queued. Loss of telemetry must not affect gameplay. Explicit opt-in
        UX for any analytics activation.

    # ---- Tests
    - path: "src/tests/**"
      instructions: >
        Vitest unit tests. Deterministic — explicit seeds, no Date.now in
        assertions, no live network. Cover error paths and engine
        invariants. Property-based tests preferred for cascade invariants
        (use fast-check if added).

    - path: "tests/**"
      instructions: >
        Playwright E2E. Required when changing board input or animation
        (per AGENTS.md "Verification"). Wait for stable selectors via
        page.waitForFunction or expect(...).toHaveText with timeouts.
        Snapshots of animations must use deterministic seeds. Run on
        both desktop and mobile viewports.

    - path: "playwright.config.ts"
      instructions: >
        Pinned browser versions. Headless by default in CI, headed locally.
        Multi-project setup for desktop + mobile viewport coverage.

    # ---- Vite / build
    - path: "vite.config.ts"
      instructions: >
        Vite config. Production builds: terser/esbuild minification on,
        sourcemaps off for production, on for staging. Pin react/phaser
        chunk splitting if bundle > 500KB. Asset path base must match
        GitHub Pages deployment subpath if non-root.

    # ---- TypeScript config
    - path: "tsconfig*.json"
      instructions: >
        TS 6 strict required: strict, noImplicitAny, strictNullChecks,
        strictFunctionTypes, strictBindCallApply, noImplicitThis,
        alwaysStrict, noUncheckedIndexedAccess, exactOptionalPropertyTypes,
        noFallthroughCasesInSwitch, noImplicitReturns.

    # ---- CI / GitHub Actions
    - path: ".github/workflows/**"
      instructions: >
        Actions pinned to commit SHA. Minimum permissions block at workflow
        root. No pull_request_target with head-ref checkout. Cache
        node_modules via actions/setup-node cache. GitHub Pages deploy
        (pages.yml) must use the deploy-pages action with OIDC, not a PAT.

    # ---- Docs
    - path: "**/*.md"
      instructions: >
        Light review. Flag broken links, stale commands, secrets pasted
        in examples. README must stay submission-ready per AGENTS.md.

  # -------------------------------------------------------------------------
  # Tools
  # -------------------------------------------------------------------------
  tools:
    rubocop:
      enabled: false                   # PwnedRabbit vector; no Ruby
    swiftlint:
      enabled: false                   # not a Swift repo
    eslint:
      enabled: true
    biome:
      enabled: true                    # OK to enable both; CR de-dupes
    gitleaks:
      enabled: true
    semgrep:
      enabled: true
    actionlint:
      enabled: true
    shellcheck:
      enabled: true
    ruff:
      enabled: false
    pylint:
      enabled: false
    phpstan:
      enabled: false
    golangci-lint:
      enabled: false
    checkov:
      enabled: false
    hadolint:
      enabled: false

# ---------------------------------------------------------------------------
# Chat
# ---------------------------------------------------------------------------
chat:
  auto_reply: true

# ---------------------------------------------------------------------------
# Knowledge base — HARDENED (matches Match/Zero posture)
# Also wires up linked repository so CodeRabbit knows iOS is source of truth.
# ---------------------------------------------------------------------------
knowledge_base:
  opt_out: true
  web_search:
    enabled: false
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
  jira:
    usage: disabled
  linear:
    usage: disabled
  mcp:
    usage: disabled
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/AGENTS.md"
      - "**/CLAUDE.md"
      - "**/HANDOFF.md"
      - "**/MEMORY.md"
      - "**/PLAN.md"

# Note: linked_repositories is a paid feature on some plans. Documented here
# so CodeRabbit's review context can hint at iOS parity even without it.
# When/if enabled, uncomment:
# reviews:
#   linked_repositories:
#     - repository: remeadows/GridWatchMatch
#       instructions: >
#         iOS Swift source of truth. Match animation timings, easing curves,
#         and game rules against ../GridWatchMatch/GridWatchMatch/GridWatchMatch/
#         View/Game/BoardNode.swift and GameScene.swift.

# ---------------------------------------------------------------------------
# Code generation
# ---------------------------------------------------------------------------
code_generation:
  docstrings:
    language: en-US
    path_instructions:
      - path: "**/*.{ts,tsx}"
        instructions: >
          TSDoc style. Document purpose, parameters, return value, thrown
          errors, side effects (DOM, network, storage mutations). For
          motion functions, cite the iOS source location (file + symbol).
          For engine functions, document determinism guarantees.
