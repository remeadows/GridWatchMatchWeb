name: CI

# Build/test signal for PRs and main. Deployment is handled by Cloudflare Pages
# via its Git integration (auto-build on push to main) — this workflow does not deploy.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Validate levels
        run: npm run validate:levels

      - name: Test
        run: npm run test

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
